name: Сборка APK GAC GS8

on:
  push:
    branches: ["agent/android-apk"]
    paths:
      - "android/**"
      - "gac-gs8-manual-site.zip"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Получение файлов проекта
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установка Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Подготовка материалов руководства
        run: |
          rm -rf android/app/src/main/assets/site
          mkdir -p android/app/src/main/assets/site
          unzip -q gac-gs8-manual-site.zip -d android/app/src/main/assets/site

      - name: Сборка тестового APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Подготовка установочного файла
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/GAC-GS8-Rukovodstvo.apk

      - name: Сохранение APK
        uses: actions/upload-artifact@v4
        with:
          name: GAC-GS8-Rukovodstvo-APK
          path: apk-output/GAC-GS8-Rukovodstvo.apk
          if-no-files-found: error
          retention-days: 30
