name: Публикация руководства GAC GS8

on:
  push:
    branches: ["main"]
    paths:
      - "gac-gs8-manual-site.zip"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение файлов
        uses: actions/checkout@v4

      - name: Распаковка руководства
        run: |
          mkdir -p _site
          unzip -q gac-gs8-manual-site.zip -d _site

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Подготовка файлов публикации
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
